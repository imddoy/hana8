<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-clifford: #da373d;
      }

      @layer base {
        button {
          @apply bg-green-300 px-2 border border-green-500 rounded-md cursor-pointer hover:bg-green-400 hover:text-white active:ring-2 active:scale-105;
        }
      }

      @layer utility {
        .btn {
          background-color: skyblue;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss-animate@1.0.7/dist/index.umd.js"></script>
  </head>
  <body class="h-screen bg-green-100 grid place-items-center">
    <div
      class="flex md:flex-col flex-row [&>button]:shadow-md [&>button]:hover:shadow-xl">
      <button class="">Button</button>
      <button class="btn text-white">Button2</button>
      <h1 class="text-3xl font-bold underline text-clifford animate-spinX">
        Hello world!
      </h1>
      <div class="border m-5">div</div>
    </div>

    <div class="container flex gap-2 bg-white rounded-md p-2 shadow-md">
      <img
        src="https://unsplash.com/photos/b51xWeb75R4/download?ixid=M3wxMjA3fDB8MXxhbGx8M3x8fHx8fHx8MTc2MTg3OTc1M3w&force=true"
        alt="lion"
        width="50"
        class="rounded-full" />
      <div>
        <div>imddoy@gmail.com</div>
        <small>description..111</small>
        <small>description..222</small>
      </div>
    </div>
  </body>
</html>
